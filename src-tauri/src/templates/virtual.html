<div id="virtual-controller">
  <div class="vc-shoulders">
    <button class="vc-btn vc-l" data-button="l">L</button>
    <div class="vc-center">
      <button class="vc-btn vc-select" data-button="select">SELECT</button>
      <button class="vc-btn vc-start" data-button="start">START</button>
    </div>
    <button class="vc-btn vc-r" data-button="r">R</button>
  </div>

  <div class="vc-main">
    <div class="vc-dpad">
      <button class="vc-btn vc-arrow vc-up" data-button="up">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0 14 12H2z"/></svg>
      </button>
      <button class="vc-btn vc-arrow vc-left" data-button="left">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M0 8 12 2v12z"/></svg>
      </button>
      <button class="vc-btn vc-arrow vc-right" data-button="right">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M16 8 4 14V2z"/></svg>
      </button>
      <button class="vc-btn vc-arrow vc-down" data-button="down">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 16 6-12H2z"/></svg>
      </button>

      <div class="vc-hit vc-hit-up" data-hit="up"></div>
      <div class="vc-hit vc-hit-down" data-hit="down"></div>
      <div class="vc-hit vc-hit-left-main" data-hit="left"></div>
      <div class="vc-hit vc-hit-left-bar" data-hit="left"></div>
      <div class="vc-hit vc-hit-right-main" data-hit="right"></div>
      <div class="vc-hit vc-hit-right-bar" data-hit="right"></div>
    </div>

    <div class="vc-face">
      <button class="vc-btn vc-b" data-button="b">B</button>
      <button class="vc-btn vc-a" data-button="a">A</button>
      
      <div class="vc-hit vc-hit-b" data-hit="b"></div>
      <div class="vc-hit vc-hit-a" data-hit="a"></div>
    </div>
  </div>
</div>
